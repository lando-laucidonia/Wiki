title: "Wiki Oficial — Império do Lando e Laucidônia"
description: "Enciclopédia canônica, atlas nacional e arquivo histórico do Império do Lando e Laucidônia."
url: "https://lando-laucidonia.github.io"
baseurl: "/Wiki"
lang: "pt-BR"
timezone: "America/Sao_Paulo"
markdown: kramdown
permalink: pretty
future: false

# As coleções editoriais ficam dentro da pasta conteudo/.
collections_dir: conteudo

exclude:
  - README.md
  - CONFIGURACAO.md
  - scripts
  - vendor
  - Gemfile.lock

collections:
  geografia:
    output: true
    permalink: /geografia/:name/
  historia:
    output: true
    permalink: /historia/:name/
  provincias:
    output: true
    permalink: /provincias/:name/
  cidades:
    output: true
    permalink: /cidades/:name/
  instituicoes:
    output: true
    permalink: /instituicoes/:name/
  personagens:
    output: true
    permalink: /personagens/:name/
  religiao:
    output: true
    permalink: /religiao/:name/
  cultura:
    output: true
    permalink: /cultura/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/images/og/og-default.png
  - scope:
      path: ""
      type: geografia
    values:
      layout: article
      section: Geografia
  - scope:
      path: ""
      type: historia
    values:
      layout: article
      section: História
  - scope:
      path: ""
      type: provincias
    values:
      layout: province
      section: Províncias
  - scope:
      path: ""
      type: cidades
    values:
      layout: article
      section: Cidades
  - scope:
      path: ""
      type: instituicoes
    values:
      layout: article
      section: Instituições
  - scope:
      path: ""
      type: personagens
    values:
      layout: article
      section: Personagens
  - scope:
      path: ""
      type: religiao
    values:
      layout: article
      section: Religião
  - scope:
      path: ""
      type: cultura
    values:
      layout: article
      section: Cultura
