- term: Língua oficial imperial
  value: landês
- term: Língua cooficial na Laucidônia
  value: laucidônico, nos termos próprios de seu Estado e de órgãos específicos
- term: Escrita
  value: alfabeto felcro como sistema oficial; alfabeto latino amplamente empregado no cotidiano
- term: Instituições nacionais
  value: recebem a qualificação “Imperial”
