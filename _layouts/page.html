---
layout: default
---
<section class="page-hero compact-hero">
  <div class="container">
    {% include breadcrumbs.html %}
    <p class="eyebrow">{{ page.kicker | default: page.section | default: 'Enciclopédia Imperial' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </div>
</section>
<section class="container content-wrap">
  <article class="prose">{{ content }}</article>
</section>
